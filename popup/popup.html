<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LinkedIn ATS Analyzer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>LinkedIn ATS Profile Analyzer</h1>
    <button id="settingsToggle" title="Settings">⚙</button>
  </header>

  <section id="settingsPanel" class="panel hidden">
    <h2>Settings</h2>

    <label for="provider">AI Provider</label>
    <select id="provider">
      <option value="anthropic">Anthropic (Claude)</option>
      <option value="openai">OpenAI (GPT)</option>
    </select>

    <div id="anthropicSettings" class="provider-settings">
      <label for="anthropicKey">Anthropic API Key</label>
      <input type="password" id="anthropicKey" placeholder="sk-ant-..." autocomplete="off" />
      <label for="anthropicModel">Model</label>
      <select id="anthropicModel">
        <option value="claude-opus-5">Claude Opus 5</option>
        <option value="claude-sonnet-5">Claude Sonnet 5</option>
        <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
      </select>
    </div>

    <div id="openaiSettings" class="provider-settings hidden">
      <label for="openaiKey">OpenAI API Key</label>
      <input type="password" id="openaiKey" placeholder="sk-..." autocomplete="off" />
      <label for="openaiModel">Model</label>
      <select id="openaiModel">
        <option value="gpt-4o">gpt-4o</option>
        <option value="gpt-4o-mini">gpt-4o-mini</option>
      </select>
    </div>

    <p class="hint">Your key is stored locally in your browser and sent only to your chosen provider's API.</p>

    <label for="region">Target Region</label>
    <select id="region">
      <option value="us">United States</option>
      <option value="europe">Europe</option>
      <option value="latam">Latin America</option>
      <option value="global">Global / Other</option>
    </select>

    <label for="techStack">Tech Stack / Focus</label>
    <select id="techStack">
      <option value="frontend-react">Front-end — React</option>
      <option value="frontend-angular">Front-end — Angular</option>
      <option value="frontend-vue">Front-end — Vue</option>
      <option value="backend-java">Back-end — Java</option>
      <option value="backend-node">Back-end — Node.js</option>
      <option value="backend-python">Back-end — Python</option>
      <option value="backend-go">Back-end — Go</option>
      <option value="fullstack">Full-stack</option>
      <option value="mobile">Mobile</option>
      <option value="devops">DevOps / SRE</option>
      <option value="data">Data Engineering / ML</option>
    </select>

    <button id="saveSettings" class="primary">Save Settings</button>
    <p id="saveConfirm" class="hint hidden">Saved.</p>
  </section>

  <section id="mainPanel" class="panel">
    <div class="upload-area" id="uploadArea">
      <input type="file" id="pdfInput" accept="application/pdf" hidden />
      <p id="uploadLabel">Drop your LinkedIn profile PDF here, or click to choose a file.</p>
      <p class="hint">On your LinkedIn profile: More → Save to PDF, then upload it here.</p>
    </div>
    <p id="fileName" class="hint hidden"></p>

    <button id="analyzeBtn" class="primary" disabled>Analyze Profile</button>
    <p id="status" class="hint hidden"></p>
  </section>

  <section id="resultsPanel" class="panel hidden">
    <div id="scores"></div>
    <p id="summary"></p>
    <div id="rewrittenHeadline"></div>
    <div id="sections"></div>
    <div id="missingKeywords"></div>
  </section>

  <script src="../js/storage.js"></script>
  <script src="../js/providers.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
